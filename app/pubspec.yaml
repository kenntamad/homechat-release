name: homechat
description: Private family messenger on a shared frequency. No servers - direct over Wi-Fi or through public relays.
publish_to: none
version: 2.0.0+20

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  http: ^1.2.0
  web_socket_channel: ">=2.4.0 <4.0.0"
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  file_picker: ">=8.1.0 <11.0.0"
  flutter_webrtc: ">=0.12.0 <2.0.0"
  record: ">=5.1.0 <7.0.0"
  audioplayers: ">=6.0.0 <7.0.0"
  flutter_local_notifications: ^19.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
